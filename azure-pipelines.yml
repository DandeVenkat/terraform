trigger:
- main

pool:
  name: 'Default'   # your self-hosted agent

variables:
  serviceConnection: 'terraformserviceconnection'

steps:

# Install Terraform
- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'

# ✅ FIXED INIT (no backend)
- task: TerraformTaskV4@4
  displayName: Init
  inputs:
    provider: 'azurerm'
    command: 'init'

# Plan (optional)
- task: TerraformTaskV4@4
  displayName: Plan
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: '$(serviceConnection)'

# Apply
- task: TerraformTaskV4@4
  displayName: Apply
  inputs:
    provider: 'azurerm'
    command: 'apply'
    environmentServiceNameAzureRM: '$(serviceConnection)'
    commandOptions: '-auto-approve'