trigger:
- main

pool:
  name: 'Default'   # your self-hosted agent

steps:

# Install Terraform
- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'

# Terraform Init
- script: |
    terraform init
  displayName: "Terraform Init"

# Terraform Plan
- script: |
    terraform plan
  displayName: "Terraform Plan"

# Terraform Apply
- script: |
    terraform apply -auto-approve
  displayName: "Terraform Apply"