trigger:
- main

pool:
  name: 'Default'   # your self-hosted agent

variables:
  serviceConnection: 'terraformserviceconnection'   # ✅ your service connection name

steps:

# ✅ Install Terraform
- task: TerraformInstaller@1
  displayName: "Install Terraform"
  inputs:
    terraformVersion: 'latest'

# ✅ Terraform Init (NO backend)
- task: TerraformTaskV4@4
  displayName: "Terraform Init"
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendType: 'local'

# ✅ Terraform Plan
- task: TerraformTaskV4@4
  displayName: "Terraform Plan"
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: '$(serviceConnection)'

# ✅ Terraform Apply
- task: TerraformTaskV4@4
  displayName: "Terraform Apply"
  inputs:
    provider: 'azurerm'
    command: 'apply'
    environmentServiceNameAzureRM: '$(serviceConnection)'
    commandOptions: '-auto-approve'